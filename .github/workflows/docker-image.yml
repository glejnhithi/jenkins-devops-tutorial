name: DOCKER IMAGE CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Docker Hub Login
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        test -n "$DOCKER_USER" || { echo "DOCKER_USER missing"; exit 1; }
        test -n "$DOCKER_PASSWORD" || { echo "DOCKER_PASSWORD missing"; exit 1; }
        echo "$DOCKER_PASSWORD" | docker login \
          --username "$DOCKER_USER" \
          --password-stdin
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag glejnhithi/jenkins-test:$(date +%s)
      
    - name: Docker Push
      run: docker push glejnhithi/jenkins-test

